# ═══════════════════════════════════════════════════════════════════════════════
# APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# This file configures Spring Boot, Artemis, and JMS behavior.
# Think of this as the "control panel" of your application.

spring:
  application:
    name: order-processing-jms

  # ─────────────────────────────────────────────────────────────────────────────
  # ARTEMIS BROKER CONFIGURATION
  # ─────────────────────────────────────────────────────────────────────────────
  # mode: embedded → Artemis runs INSIDE our app (no separate installation!)
  #   - In production, you'd change this to "native" and point to an external broker
  #   - Embedded mode is perfect for learning and development
  #
  # broker-url: vm://0 → "Virtual Machine" protocol, meaning in-memory
  #   - This is the fastest connection type for embedded mode
  #   - No network overhead since everything is in the same JVM
  artemis:
    mode: embedded
    broker-url: vm://0
    embedded:
      enabled: true
      queues: order-queue   # Auto-create this queue on startup

  # ─────────────────────────────────────────────────────────────────────────────
  # JMS CONFIGURATION
  # ─────────────────────────────────────────────────────────────────────────────
  jms:
    # pub-sub-domain: false → We're using QUEUES (point-to-point), NOT topics
    #   - Queue: One message → one consumer (like a to-do list)
    #   - Topic: One message → all subscribers (like a broadcast)
    pub-sub-domain: false

    listener:
      # ═══════════════════════════════════════════════════════════════
      # THIS IS THE KEY SETTING FOR TRANSACTIONS!
      # ═══════════════════════════════════════════════════════════════
      #
      # session-transacted: true
      #   → Every @JmsListener call is wrapped in a JMS transaction
      #   → If your listener method completes normally → message is COMMITTED (removed from queue)
      #   → If your listener method throws an exception → message is ROLLED BACK (stays in queue for retry)
      #
      # This is HOW we achieve "all or nothing" processing!
      session-transacted: true

      # acknowledge-mode is ignored when session-transacted is true
      # (transactions handle acknowledgment automatically)
      acknowledge-mode: auto

      # concurrency: "1-3" → Min 1, Max 3 listener threads
      #   - Artemis will scale up threads if messages pile up
      concurrency: 1
      max-concurrency: 3

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
# We set DEBUG level for our package so you can see EVERY step in the console.
# In production, you'd set this to INFO or WARN.
logging:
  level:
    com.learnwithashfaq.artemis: DEBUG
    org.springframework.jms: INFO
    org.apache.activemq.artemis: WARN

# ─────────────────────────────────────────────────────────────────────────────
# SERVER CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8080
